name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-proofs:
    name: Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify self-hosted compiler fixed point
        run: cmake --build build --target forge-selfhost-verify --parallel
      - name: Verify installed external Forge project
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/forge-sdk"
          cmake -S examples/external-project -B "$RUNNER_TEMP/forge-external" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/forge-sdk"
          cmake --build "$RUNNER_TEMP/forge-external" --parallel
          "$RUNNER_TEMP/forge-external/bin/hello"
          "$RUNNER_TEMP/forge-external/sdk_runtime"
          "$RUNNER_TEMP/forge-external/sdk_std"
