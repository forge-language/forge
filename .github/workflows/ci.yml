name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Compiler and component integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned components
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --build build --target forge-selfhost-verify -j2
      - name: Run the UTF-8 log example on all three compiler paths
        run: |
          test "$(build/bin/log_alerts)" = 'alerts=3'
          build/bin/forge examples/log_alerts.fg --emit-js -o build/log_alerts.js
          test "$(node build/log_alerts.js)" = 'alerts=3'
          build/bin/forge-stage2 examples/log_alerts.fg --check
          build/bin/forge-stage2 examples/log_alerts.fg --forge-root "$PWD/build" -o build/alerts-fg
          test "$(build/alerts-fg)" = 'alerts=3'
      - name: Verify installed external consumers
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/forge-sdk"
          cmake -S examples/external-project -B "$RUNNER_TEMP/forge-external" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/forge-sdk"
          cmake --build "$RUNNER_TEMP/forge-external" -j2
          "$RUNNER_TEMP/forge-external/bin/hello"
          "$RUNNER_TEMP/forge-external/sdk_runtime"
          "$RUNNER_TEMP/forge-external/sdk_std"
          "$RUNNER_TEMP/forge-external/c_greeting"
